server:
  port: 8081

spring:
  profiles:
    default: dev
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/order_service
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # safe default; dev and docker profiles override this
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: order-service-group
      auto-offset-reset: earliest

  # 모든 노드를 적는 이유는 1개만 설정했을 때 해당 노드가 죽어있을 수 있음.
  data:
    redis:
      cluster:
        nodes:
          - redis-cluster.local:7001
          - redis-cluster.local:7002
          - redis-cluster.local:7003
          - redis-cluster.local:7004
          - redis-cluster.local:7005
          - redis-cluster.local:7006
        max-redirects: 3 # MOVED 응답 시 최대 재시도 횟수

outbox:
  topic: order-events
  polling-ms: 200

dlt:
  topics: payment-events.DLT,product-events.DLT,shipping-events.DLT
  operations:
    enabled: ${DLT_OPERATIONS_ENABLED:false}
    token: ${DLT_OPERATIONS_TOKEN:}

jwt:
  secret: ${JWT_SECRET:}

order:
  commission-rate: 0.1
  idempotency:
    retention-seconds: 86400
    cleanup-fixed-delay-ms: 3600000
  inventory:
    orphan-cleanup-fixed-delay-ms: 10000
    orphan-cleanup-batch-size: 100
    orphan-cleanup-failure-backoff-seconds: 60
    terminal-retention-seconds: 604800
    stock-event-retention-seconds: 2592000
    reconciliation-fixed-delay-ms: ${INVENTORY_RECONCILIATION_FIXED_DELAY_MS:300000}
    reconciliation-batch-size: ${INVENTORY_RECONCILIATION_BATCH_SIZE:100}
  saga-reconciliation:
    fixed-delay-ms: ${SAGA_RECONCILIATION_FIXED_DELAY_MS:60000}
    stale-after-seconds: ${SAGA_RECONCILIATION_STALE_AFTER_SECONDS:300}
    batch-size: ${SAGA_RECONCILIATION_BATCH_SIZE:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
    tags:
      service: ${spring.application.name}

