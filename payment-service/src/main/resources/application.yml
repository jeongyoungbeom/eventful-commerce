server:
  port: 8082

spring:
  profiles:
    default: dev
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_service
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # safe default; dev and docker profiles override this
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

#  flyway:
#    enabled: true
#    locations: classpath:db/migration

outbox:
  topic: payment-events
  polling-ms: 200

dlt:
  topics: order-events.DLT
  operations:
    enabled: ${DLT_OPERATIONS_ENABLED:false}
    token: ${DLT_OPERATIONS_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
    tags:
      service: ${spring.application.name}

