server:
  port: 8084

spring:
  profiles:
    default: dev
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5432/notification_service
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: notification-service-group
      auto-offset-reset: earliest

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:your-bot-token-here}
    username: ${TELEGRAM_BOT_USERNAME:eventful_commerce_bot}
  default-user:
    user-id: ${TELEGRAM_DEFAULT_USER_ID:}
    chat-id: ${TELEGRAM_DEFAULT_CHAT_ID:}

notification:
  delivery:
    fixed-delay-ms: 5000
    max-attempts: 10
    initial-backoff-seconds: 10
    max-backoff-seconds: 3600
  kafka:
    topics:
      order-events: order-events
      payment-events: payment-events
      shipping-events: shipping-events

outbox:
  topic: notification-events
  polling-ms: 200

dlt:
  topics: order-events.DLT,payment-events.DLT,shipping-events.DLT
  operations:
    enabled: ${DLT_OPERATIONS_ENABLED:false}
    token: ${DLT_OPERATIONS_TOKEN:}

jwt:
  secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
    tags:
      service: ${spring.application.name}
